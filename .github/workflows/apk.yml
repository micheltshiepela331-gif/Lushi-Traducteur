          // Filtre audio simple (biquad). Sert à garder la bande de la voix humaine
          // et à atténuer les basses et les aigus de la musique de fond.
          class Filtre(private val b0: Float, private val b1: Float, private val b2: Float,
                       private val a1: Float, private val a2: Float) {
              private var x1 = 0f
              private var x2 = 0f
              private var y1 = 0f
              private var y2 = 0f
              fun f(x: Float): Float {
                  val y = b0 * x + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2
                  x2 = x1; x1 = x; y2 = y1; y1 = y
                  return y
              }
              companion object {
                  fun passeHaut(fc: Float, fs: Float): Filtre {
                      val w = 2.0 * Math.PI * fc / fs
                      val c = Math.cos(w); val al = Math.sin(w) / (2 * 0.707)
                      val a0 = 1 + al
                      return Filtre(((1 + c) / 2 / a0).toFloat(), (-(1 + c) / a0).toFloat(), ((1 + c) / 2 / a0).toFloat(),
                          (-2 * c / a0).toFloat(), ((1 - al) / a0).toFloat())
                  }
                  fun passeBas(fc: Float, fs: Float): Filtre {
                      val w = 2.0 * Math.PI * fc / fs
                      val c = Math.cos(w); val al = Math.sin(w) / (2 * 0.707)
                      val a0 = 1 + al
                      return Filtre(((1 - c) / 2 / a0).toFloat(), ((1 - c) / a0).toFloat(), ((1 - c) / 2 / a0).toFloat(),
                          (-2 * c / a0).toFloat(), ((1 - al) / a0).toFloat())
                  }
              }
          }

