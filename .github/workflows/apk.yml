              private fun majBoutonTraduire() {
                  val l = cibleReponse ?: langue
                  btTraduire?.text = when {
                      l == null -> "Traduire"
                      l.code == CIBLE -> "Garder en français"
                      else -> "Traduire en ${l.nom}"
                  }
              }

              // Quand on a fini, la barre lâche le clavier pour qu'on puisse écrire dans le live.
              private fun rendreFocusable(oui: Boolean) {
                  val br = barre ?: return
                  val lp = lpBarre ?: return
                  val avant = lp.flags
                  lp.flags = if (oui) WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                  else WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                  if (lp.flags != avant) {
                      try { wm.updateViewLayout(br, lp) } catch (_: Exception) {}
                  }
                  if (!oui) {
                      etMessage?.let { getSystemService(InputMethodManager::class.java)?.hideSoftInputFromWindow(it.windowToken, 0) }
                  }
              }

              private fun traduireMessage() {
                  val texte = etMessage?.text?.toString()?.trim() ?: ""
                  if (texte.isEmpty()) {
                      tvResultat?.text = "Écris d'abord ton message en français."
                      return
                  }
                  val l = cibleReponse ?: langue
                  if (l == null) {
                      tvResultat?.text = "Attends que la langue du live soit reconnue, ou choisis une langue ci-dessus."
                      return
                  }
                  majBoutonTraduire()
                  if (l.code == CIBLE) {
                      montrerResultat(texte)
                      return
                  }
                  if (traducteurRetour == null || codeRetour != l.code) {
                      try { traducteurRetour?.close() } catch (_: Exception) {}
                      traducteurRetour = Translation.getClient(
                          TranslatorOptions.Builder().setSourceLanguage(CIBLE).setTargetLanguage(l.code).build()
                      )
                      codeRetour = l.code
                  }
                  val tr = traducteurRetour ?: return
                  tvResultat?.text = "Traduction en ${l.nom}..."
                  tr.downloadModelIfNeeded(DownloadConditions.Builder().build())
                      .addOnSuccessListener {
                          tr.translate(texte)
                              .addOnSuccessListener { r -> montrerResultat(r) }
                              .addOnFailureListener { tvResultat?.text = "Traduction impossible. Réessaie." }
                      }
                      .addOnFailureListener { tvResultat?.text = "Téléchargement de la langue impossible. Vérifie Internet." }
              }

              private fun montrerResultat(r: String) {
                  tvResultat?.text = r
                  copierResultat()
              }

              private fun copierResultat() {
                  val r = tvResultat?.text?.toString() ?: return
                  if (r.isBlank() || r.startsWith("La traduction apparaîtra")) return
                  val cm = getSystemService(ClipboardManager::class.java) ?: return
                  cm.setPrimaryClip(ClipData.newPlainText("Lushi Traducteur", r))
                  Toast.makeText(this, "Copié ! Colle-le dans les commentaires du live.", Toast.LENGTH_SHORT).show()
                  rendreFocusable(false)
              }

              private fun fermerBarre() {
                  val br = barre ?: return
                  etMessage?.let { getSystemService(InputMethodManager::class.java)?.hideSoftInputFromWindow(it.windowToken, 0) }
                  try { wm.removeView(br) } catch (_: Exception) {}
                  barre = null
                  lpBarre = null
                  etMessage = null
                  tvResultat = null
                  btTraduire = null
              }

              // ======================== LECTURE DES TEXTES DE L'ECRAN ========================
              // Prend une image de l'écran, lit les textes (sous-titres, titres, messages de
              // l'interview...) et les traduit en français. Les fenêtres de la bulle sont ignorées.
              private var panneauEcran: LinearLayout? = null
              private var listeEcran: LinearLayout? = null
              private var btAutoEcran: TextView? = null
              private var ecranAuto = false
              private var ecranOccupe = false
              private val dejaVus = LinkedHashSet<String>()
              private var lecteurTexte: TextRecognizer? = null
              private var codeLecteur = ""
              private val tourEcran = object : Runnable {
                  override fun run() {
                      if (ecranAuto && actif && panneauEcran != null) {
                          lireEcran()
                          main.postDelayed(this, 4000)
                      }
                  }
              }

              private fun lecteurPour(code: String): TextRecognizer {
                  val voulu = when (code) {
                      "ko", "ja", "zh", "hi" -> code
                      else -> "latin"
                  }
                  val ancien = lecteurTexte
                  if (ancien != null && codeLecteur == voulu) return ancien
                  try { ancien?.close() } catch (_: Exception) {}
                  val n = when (voulu) {
                      "ko" -> TextRecognition.getClient(KoreanTextRecognizerOptions.Builder().build())
                      "ja" -> TextRecognition.getClient(JapaneseTextRecognizerOptions.Builder().build())
                      "zh" -> TextRecognition.getClient(ChineseTextRecognizerOptions.Builder().build())
                      "hi" -> TextRecognition.getClient(DevanagariTextRecognizerOptions.Builder().build())
                      else -> TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
                  }
                  lecteurTexte = n
                  codeLecteur = voulu
                  return n
              }

              private fun zonesBulle(): List<Rect> {
                  val zones = mutableListOf<Rect>()
                  listOfNotNull<View>(bulle, panneau, barre, menu, panneauEcran).forEach { v ->
                      if (v.visibility == View.VISIBLE && v.width > 0) {
                          val pos = IntArray(2)
                          v.getLocationOnScreen(pos)
                          zones.add(Rect(pos[0], pos[1], pos[0] + v.width, pos[1] + v.height))
                      }
                  }
                  return zones
              }

              private fun lireEcran() {
                  if (ecranOccupe) return
                  val pj = projection
                  if (pj == null) {
                      ajouterLigneEcran("Pour lire l'écran, lance la bulle avec « Son du téléphone ».", null)
                      return
                  }
                  val l = langue
                  if (l == null) {
                      ajouterLigneEcran("Attends que la langue du live soit reconnue, ou choisis-la dans le menu.", null)
                      return
                  }
                  ecranOccupe = true
                  val m = resources.displayMetrics
                  val w = m.widthPixels
                  val h = m.heightPixels
                  val zones = zonesBulle()
                  val reader = try {
                      ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                  } catch (e: Exception) {
                      ecranOccupe = false
                      ajouterLigneEcran("Lecture de l'écran impossible sur ce téléphone.", null)
                      return
                  }
                  val vd: VirtualDisplay? = try {
                      pj.createVirtualDisplay("lushi-ecran", w, h, m.densityDpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader.surface, null, main)
                  } catch (e: Exception) {
                      try { reader.close() } catch (_: Exception) {}
                      ecranOccupe = false
                      ajouterLigneEcran("Lecture de l'écran impossible sur ce téléphone.", null)
                      return
                  }
                  main.postDelayed({
                      var bmp: Bitmap? = null
                      try {
                          val img = reader.acquireLatestImage()
                          if (img != null) {
                              val plan = img.planes[0]
                              val large = plan.rowStride / plan.pixelStride
                              val brut = Bitmap.createBitmap(large, h, Bitmap.Config.ARGB_8888)
                              brut.copyPixelsFromBuffer(plan.buffer)
                              bmp = if (large != w) Bitmap.createBitmap(brut, 0, 0, w, h) else brut
                              img.close()
                          }
                      } catch (_: Exception) {}
                      try { vd?.release() } catch (_: Exception) {}
                      try { reader.close() } catch (_: Exception) {}
                      val image = bmp
                      if (image == null) {
                          ecranOccupe = false
                          return@postDelayed
                      }
                      lecteurPour(l.code).process(InputImage.fromBitmap(image, 0))
                          .addOnSuccessListener { res ->
                              val textes = res.textBlocks.filter { bloc ->
                                  val b = bloc.boundingBox
                                  b == null || zones.none { it.contains(b.centerX(), b.centerY()) }
                              }.map { it.text.replace('\n', ' ').trim() }
                              traiterTexteEcran(textes)
                              ecranOccupe = false
                          }
                          .addOnFailureListener {
                              ecranOccupe = false
                              ajouterLigneEcran("Lecture du texte impossible (la première fois, il faut Internet).", null)
                          }
                  }, 350)
              }

              private fun traiterTexteEcran(textes: List<String>) {
                  val nouveaux = textes.filter { t -> t.length >= 2 && t.any { it.isLetter() } && !dejaVus.contains(t) }
                  if (nouveaux.isEmpty()) {
                      if (!ecranAuto) ajouterLigneEcran("Aucun nouveau texte à l'écran.", null)
                      return
                  }
                  nouveaux.take(12).forEach { t ->
                      dejaVus.add(t)
                      if (dejaVus.size > 400) dejaVus.remove(dejaVus.first())
                      traduire(t) { fr -> ajouterLigneEcran(fr, t) }
                  }
              }

              private fun ajouterLigneEcran(fr: String, orig: String?) {
                  val liste = listeEcran ?: return
                  val bloc = LinearLayout(this)
                  bloc.orientation = LinearLayout.VERTICAL
                  bloc.setPadding(0, dp(6f), 0, dp(6f))
                  val t1 = TextView(this)
                  t1.text = fr
                  t1.setTextColor(Color.WHITE)
                  t1.textSize = 15f
                  t1.setTypeface(null, Typeface.BOLD)
                  t1.setTextIsSelectable(false)
                  bloc.addView(t1)
                  if (orig != null && orig != fr) {
                      val t2 = TextView(this)
                      t2.text = orig
                      t2.setTextColor(0xFF9AA4C8.toInt())
                      t2.textSize = 12f
                      t2.setTypeface(null, Typeface.ITALIC)
                      bloc.addView(t2)
                  }
                  liste.addView(bloc, 0)
                  while (liste.childCount > 40) liste.removeViewAt(liste.childCount - 1)
              }

              private fun ouvrirPanneauEcran() {
                  if (panneauEcran != null) return
                  val pad = dp(12f)
                  val pe = LinearLayout(this)
                  pe.orientation = LinearLayout.VERTICAL
                  pe.setPadding(pad, dp(8f), pad, dp(10f))
                  val verre = GradientDrawable()
                  verre.setColor(0xEE0D1222.toInt())
                  verre.cornerRadius = dp(18f).toFloat()
                  verre.setStroke(dp(1f), 0x66FFB74D)
                  pe.background = verre
                  pe.elevation = dp(10f).toFloat()

                  val entete = LinearLayout(this)
                  entete.orientation = LinearLayout.HORIZONTAL
                  entete.gravity = Gravity.CENTER_VERTICAL
                  val titre = TextView(this)
                  titre.text = "📷 Textes de l'écran"
                  titre.setTextColor(0xFF2B1600.toInt())
                  titre.textSize = 11f
                  titre.setTypeface(null, Typeface.BOLD)
                  titre.background = fond(0xFFFFB74D.toInt(), dp(10f).toFloat())
                  titre.setPadding(dp(8f), dp(2f), dp(8f), dp(2f))
                  entete.addView(titre, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  fun ajouter(v: TextView) {
                      val l = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      l.leftMargin = dp(6f)
                      entete.addView(v, l)
                  }
                  ajouter(bouton("Lire") { lireEcran() })
                  val auto = bouton("Auto : non") {
                      ecranAuto = !ecranAuto
                      btAutoEcran?.text = if (ecranAuto) "Auto : oui" else "Auto : non"
                      main.removeCallbacks(tourEcran)
                      if (ecranAuto) main.post(tourEcran)
                  }
                  btAutoEcran = auto
                  ajouter(auto)
                  ajouter(bouton("✕") { fermerPanneauEcran() })
                  pe.addView(entete)

                  val defil = ScrollView(this)
                  val liste = LinearLayout(this)
                  liste.orientation = LinearLayout.VERTICAL
                  defil.addView(liste)
                  val lpDefil = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(200f))
                  lpDefil.topMargin = dp(6f)
                  pe.addView(defil, lpDefil)

                  val ecran = resources.displayMetrics
                  val lp = WindowManager.LayoutParams(
                      ecran.widthPixels - dp(16f),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = dp(8f)
                  lp.y = (ecran.heightPixels * 0.45f).toInt()
                  rendreDeplacable(entete, pe, lp, null)
                  try {
                      wm.addView(pe, lp)
                  } catch (_: Exception) {
                      return
                  }
                  panneauEcran = pe
                  listeEcran = liste
              }

              private fun fermerPanneauEcran() {
                  ecranAuto = false
                  main.removeCallbacks(tourEcran)
                  val pe = panneauEcran ?: return
                  try { wm.removeView(pe) } catch (_: Exception) {}
                  panneauEcran = null
                  listeEcran = null
                  btAutoEcran = null
              }

              // ======================== MOTEUR CONTINU VOSK ========================
              // Reconnaissance vocale libre et gratuite, sans coupure, qui marche sans Internet
              // une fois la langue téléchargée (une seule fois).
              private val verrouVosk = Any()
              @Volatile private var voskRec: Recognizer? = null
              private var voskModele: Model? = null
              @Volatile private var voskCode = ""
              @Volatile private var dernierPartielVosk = ""

              private fun traductionActive(): Boolean = ecouteActive || voskRec != null

              private fun texteVosk(json: String, cle: String): String {
                  val t = try { JSONObject(json).optString(cle, "").trim() } catch (_: Exception) { "" }
                  // Vosk sépare les caractères chinois et japonais par des espaces : on les recolle.
                  return if (voskCode == "zh" || voskCode == "ja") t.replace(" ", "") else t
              }

              private fun recuVosk(t: String) {
                  if (!actif || voskRec == null) return
                  derniereReussite = SystemClock.elapsedRealtime()
                  couleurBulle(VERT)
                  finale(t)
              }

              private fun partielVosk(t: String) {
                  if (!actif || voskRec == null) return
                  partiel(t)
              }

              private fun dossierVosk(l: Langue) = File(File(filesDir, "vosk"), l.vosk)

              private fun modeleInstalle(d: File) = File(d, "am").isDirectory || File(d, "conf").isDirectory

              private fun demarrerVosk(l: Langue) {
                  arreterEcoute()
                  arreterVosk()
                  val d = dossierVosk(l)
                  if (modeleInstalle(d)) chargerVosk(l, d) else telechargerVosk(l, d)
              }

              private fun telechargerVosk(l: Langue, dossier: File) {
                  couleurBulle(ORANGE)
                  tvTrad?.text = "Téléchargement du moteur ${l.nom} (une seule fois, gratuit)..."
                  Thread {
                      var ok = false
                      try {
                          val racine = File(filesDir, "vosk")
                          racine.mkdirs()
                          val zip = File(racine, l.vosk + ".zip")
                          val c = URL("https://alphacephei.com/vosk/models/${l.vosk}.zip").openConnection() as HttpURLConnection
                          c.connectTimeout = 20000
                          c.readTimeout = 30000
                          c.instanceFollowRedirects = true
                          val total = c.contentLengthLong
                          c.inputStream.use { entree ->
                              FileOutputStream(zip).use { sortie ->
                                  val b = ByteArray(64 * 1024)
                                  var lu = 0L
                                  var dernier = -1
                                  while (true) {
                                      val n = entree.read(b)
                                      if (n < 0) break
                                      sortie.write(b, 0, n)
                                      lu += n
                                      if (!actif) throw IOException("arrêt")
                                      if (total > 0) {
                                          val pc = (lu * 100 / total).toInt()
                                          if (pc != dernier) {
                                              dernier = pc
                                              val mo = lu / 1048576
                                              val tot = total / 1048576
                                              main.post { if (langue == l) tvTrad?.text = "Téléchargement du moteur ${l.nom} : $pc % ($mo / $tot Mo)" }
                                          }
                                      }
                                  }
                              }
                          }
                          main.post { if (langue == l) tvTrad?.text = "Installation du moteur ${l.nom}..." }
                          val base = racine.canonicalPath + File.separator
                          ZipInputStream(FileInputStream(zip)).use { zin ->
                              while (true) {
                                  val e = zin.nextEntry ?: break
                                  val f = File(racine, e.name)
                                  if (!f.canonicalPath.startsWith(base)) continue
                                  if (e.isDirectory) {
                                      f.mkdirs()
                                  } else {
                                      f.parentFile?.mkdirs()
                                      FileOutputStream(f).use { zin.copyTo(it) }
                                  }
                              }
                          }
                          zip.delete()
                          ok = modeleInstalle(dossier)
                      } catch (e: Exception) {
                          ok = false
                      }
                      main.post {
                          if (!actif || langue != l) return@post
                          if (ok) {
                              chargerVosk(l, dossier)
                          } else {
                              tvOrig?.text = "Téléchargement du moteur impossible. Vérifie Internet. J'utilise le moteur Google en attendant."
                              demarrerEcoute()
                          }
                      }
                  }.start()
              }

              private fun chargerVosk(l: Langue, dossier: File) {
                  tvTrad?.text = "Démarrage du moteur continu ${l.nom}..."
                  Thread {
                      val paire: Pair<Model, Recognizer>? = try {
                          val m = Model(dossier.absolutePath)
                          Pair(m, Recognizer(m, TAUX.toFloat()))
                      } catch (e: Throwable) {
                          null
                      }
                      main.post {
                          if (paire == null || !actif || langue != l) {
                              try { paire?.second?.close() } catch (_: Exception) {}
                              try { paire?.first?.close() } catch (_: Exception) {}
                              if (paire == null && actif && langue == l) {
                                  tvOrig?.text = "Moteur continu indisponible : j'utilise le moteur Google."
                                  demarrerEcoute()
                              }
                              return@post
                          }
                          synchronized(verrouVosk) {
                              voskModele = paire.first
                              voskRec = paire.second
                              voskCode = l.code
                          }
                          derniereReussite = SystemClock.elapsedRealtime()
                          couleurBulle(VERT)
                          if (lignes.isEmpty()) tvTrad?.text = "🎧 Moteur continu prêt : ${l.nom} > français."
                      }
                  }.start()
              }

              private fun arreterVosk() {
                  synchronized(verrouVosk) {
                      try { voskRec?.close() } catch (_: Exception) {}
                      try { voskModele?.close() } catch (_: Exception) {}
                      voskRec = null
                      voskModele = null
                  }
                  dernierPartielVosk = ""
              }

              override fun onDestroy() {
                  captureOn = false
                  try { filCapture?.join(300) } catch (_: Exception) {}
                  arreterVosk()
                  enMarche = false
                  fermerPanneauEcran()
                  try { lecteurTexte?.close() } catch (_: Exception) {}
                  fermerMenu()
                  fermerBarre()
                  try { recoVoix?.destroy() } catch (_: Exception) {}
                  try { ttsRep?.shutdown() } catch (_: Exception) {}
                  try { traducteurRetour?.close() } catch (_: Exception) {}
                  actif = false
                  captureOn = false
                  main.removeCallbacksAndMessages(null)
                  try { reco?.destroy() } catch (_: Exception) {}
                  reco = null
                  try { recoTest?.destroy() } catch (_: Exception) {}
                  recoTest = null
                  ecriture = null
                  try { lecture?.close() } catch (_: Exception) {}
                  try { lectureTest?.close() } catch (_: Exception) {}
                  try { filCapture?.join(300) } catch (_: Exception) {}
                  try { enregistreur?.stop() } catch (_: Exception) {}
                  try { enregistreur?.release() } catch (_: Exception) {}
                  try { projection?.stop() } catch (_: Exception) {}
                  if (::wm.isInitialized) {
                      bulle?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                      panneau?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  }
                  try { traducteur?.close() } catch (_: Exception) {}
                  try { tts?.shutdown() } catch (_: Exception) {}
                  super.onDestroy()
              }
          }
          LUSHI_FIN


      - name: Fabriquer l'APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cle.jks"
            export KS_FILE="$RUNNER_TEMP/cle.jks"
            export KS_ALIAS=$(keytool -list -keystore "$KS_FILE" -storepass "$KS_PASS" 2>/dev/null | grep -i PrivateKeyEntry | head -1 | cut -d, -f1)
            echo "Signature avec la cle LushiPratique (alias: $KS_ALIAS)"
          else
            echo "Pas de cle dans les secrets : APK signe avec la cle de test."
          fi
          gradle -p proj assembleRelease --no-daemon
          cp proj/app/build/outputs/apk/release/app-release.apk lushi-traducteur.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lushi-traducteur-apk
          path: lushi-traducteur.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.${{ github.run_number }}
          name: Lushi Traducteur v4.${{ github.run_number }}
          files: lushi-traducteur.apk
