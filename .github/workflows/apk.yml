                  swVosk.setPadding(0, dp(4f), 0, dp(10f))
                  racine.addView(swVosk)

                  val bt = Button(this)
                  bt.text = "LANCER LA BULLE"
                  bt.textSize = 18f
                  bt.setTextColor(Color.WHITE)
                  bt.background = fond(TURQUOISE, dp(14f).toFloat())
