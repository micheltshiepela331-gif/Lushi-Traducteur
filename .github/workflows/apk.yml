              private fun etat(m: String) {
                  tvEtat.text = m
              }

              private fun lancer() {
                  prefs.edit()
                      .putInt("src5", spSource.selectedItemPosition)
                      .putBoolean("micro", !rbInterne.isChecked)
                      .putBoolean("voix", swVoix.isChecked)
                      .apply()
                  if (!Settings.canDrawOverlays(this)) {
                      etat("Autorise « Afficher par-dessus les autres applis », puis reviens et appuie encore sur LANCER.")
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  val manque = mutableListOf<String>()
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      manque.add(Manifest.permission.RECORD_AUDIO)
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      manque.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  if (manque.isNotEmpty()) {
                      requestPermissions(manque.toTypedArray(), 1)
                      return
                  }
                  preparerLangue()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                      preparerLangue()
                  } else {
                      etat("Sans l'autorisation « micro / audio », la bulle ne peut pas écouter.")
                  }
              }

              private fun preparerLangue() {
                  val s = LANGUES[spSource.selectedItemPosition]
                  etat("Préparation ${s.nom} > français... (la première fois, il faut Internet)")
                  val tr = Translation.getClient(
                      TranslatorOptions.Builder().setSourceLanguage(s.code).setTargetLanguage(CIBLE).build()
                  )
                  tr.downloadModelIfNeeded(DownloadConditions.Builder().build())
                      .addOnSuccessListener {
                          tr.close()
                          suite()
                      }
                      .addOnFailureListener { e ->
                          tr.close()
                          etat("Téléchargement de la langue impossible. Vérifie ta connexion. (${e.message})")
                      }
              }

              private fun suite() {
                  if (rbInterne.isChecked) {
                      val mpm = getSystemService(MediaProjectionManager::class.java)
                      etat("Accepte le message d'Android : il permet à la bulle d'entendre le son du téléphone.")
                      @Suppress("DEPRECATION")
                      startActivityForResult(mpm.createScreenCaptureIntent(), 2)
                  } else {
                      demarrer(null, 0)
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  @Suppress("DEPRECATION")
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 2) {
                      if (resultCode == Activity.RESULT_OK && data != null) demarrer(data, resultCode)
                      else etat("Refusé. Accepte le message, ou choisis le mode Micro.")
                  }
              }

              private fun demarrer(data: Intent?, code: Int) {
                  stopService(Intent(this, BulleService::class.java))
                  val i = Intent(this, BulleService::class.java)
                  i.putExtra("src", spSource.selectedItemPosition)
                  i.putExtra("voix", swVoix.isChecked)
                  i.putExtra("interne", data != null)
                  i.putExtra("code", code)
                  if (data != null) i.putExtra("data", data)
                  startForegroundService(i)
                  etat("✅ Bulle lancée. Ouvre le live : la bulle flotte au-dessus.")
                  moveTaskToBack(true)
              }
          }

          // =====================================================================
          //  LA BULLE
          // =====================================================================
          class BulleService : Service() {

              private data class Strat(val surAppareil: Boolean, val parSource: Boolean, val segmente: Boolean)

              private val main = Handler(Looper.getMainLooper())
              private lateinit var wm: WindowManager
              private var bulle: ImageView? = null
              private var panneau: LinearLayout? = null
              private var lpPanneau: WindowManager.LayoutParams? = null
              private var tvTitre: TextView? = null
              private var tvTrad: TextView? = null
              private var tvOrig: TextView? = null

              private var projection: MediaProjection? = null
              private var enregistreur: AudioRecord? = null
              private var filCapture: Thread? = null
              private var captureMicro = false
              @Volatile private var captureOn = false
              @Volatile private var actif = false
              @Volatile private var ecriture: ParcelFileDescriptor? = null
              private var lecture: ParcelFileDescriptor? = null
              @Volatile private var derniereVoix = 0L

              private var reco: SpeechRecognizer? = null
              private var recoStrat: Strat? = null
              private val strats = mutableListOf<Strat>()
              private var strategie = 0
              private var resultatsDansStrategie = false
              private var erreursSuite = 0
              private var videsSuite = 0
              private var enCours = false
              private var dernierSigne = 0L
              private val tagEfficace = HashMap<String, String>()
              private val reglages by lazy { getSharedPreferences("lushi", Context.MODE_PRIVATE) }

              private var langue = LANGUES[0]
              private var traducteur: Translator? = null
              private var traducteurPret = false
              private var tts: TextToSpeech? = null
              private var ttsPret = false
              private var voix = false
              private var interne = true
              private val lignes = ArrayDeque<String>()
              private var partielTrad = ""
              private var seqPartiel = 0
              private var dernierPartiel = 0L
              private var ligneDePause = false
              private var taille = 19f
              private var demarre = false

              private val runSession = Runnable { nouvelleSession() }
              private val validerPause = Runnable { poserPause() }

              private val garde = object : Runnable {
                  override fun run() {
                      if (!actif) return
                      if (enCours && SystemClock.elapsedRealtime() - dernierSigne > 25000) {
                          try { reco?.cancel() } catch (_: Exception) {}
                          enCours = false
                          nouvelleSession()
                      }
                      main.postDelayed(this, 5000)
                  }
              }

              private fun cleStrat(st: Strat) = "${st.surAppareil}-${st.parSource}-${st.segmente}"
              private fun tag(l: Langue): String = tagEfficace[l.code] ?: l.parole

              override fun onBind(intent: Intent?): IBinder? = null

              @Suppress("DEPRECATION")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP") {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (demarre || intent == null) return START_NOT_STICKY
                  demarre = true

                  langue = LANGUES[intent.getIntExtra("src", 0).coerceIn(0, LANGUES.size - 1)]
                  voix = intent.getBooleanExtra("voix", false)
                  interne = intent.getBooleanExtra("interne", false)

                  allumerPremierPlan()

                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  try {
                      creerPanneau()
                      creerBulle()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Autorise « Afficher par-dessus les autres applis » pour Lushi Traducteur.", Toast.LENGTH_LONG).show()
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (voix) preparerVoix()
                  actif = true

                  var captureOk = false
                  if (interne) {
                      val code = intent.getIntExtra("code", 0)
                      val data: Intent? = intent.getParcelableExtra("data")
                      try {
                          val mpm = getSystemService(MediaProjectionManager::class.java)
                          projection = if (data != null) mpm.getMediaProjection(code, data) else null
                          projection?.registerCallback(object : MediaProjection.Callback() {
                              override fun onStop() {
                                  main.post { stopSelf() }
                              }
                          }, main)
                      } catch (e: Exception) {
                          projection = null
                      }
                      captureOk = projection != null && demarrerCapture(true)
                  }
                  if (!captureOk) {
                      interne = false
                      captureOk = demarrerCapture(false)
                  }

                  strats.clear()
                  if (captureOk && Build.VERSION.SDK_INT >= 33) {
                      if (SpeechRecognizer.isOnDeviceRecognitionAvailable(this)) {
                          strats.add(Strat(surAppareil = true, parSource = true, segmente = true))
                      }
                      strats.add(Strat(surAppareil = false, parSource = true, segmente = true))
                      strats.add(Strat(surAppareil = false, parSource = true, segmente = false))
                  }
                  strats.add(Strat(surAppareil = false, parSource = false, segmente = false))

                  preparerTraducteur()
                  couleurBulle(ORANGE)
                  demarrerEcoute()
                  main.postDelayed(garde, 5000)
                  return START_NOT_STICKY
              }

              private fun allumerPremierPlan() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel(CANAL, "Bulle de traduction", NotificationManager.IMPORTANCE_LOW))
                  val stop = PendingIntent.getService(
                      this, 1, Intent(this, BulleService::class.java).setAction("STOP"),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val ouvrir = PendingIntent.getActivity(
                      this, 2, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val n = Notification.Builder(this, CANAL)
                      .setSmallIcon(R.drawable.ic_launcher)
                      .setContentTitle("Lushi Traducteur actif")
                      .setContentText("${langue.nom} > français")
                      .setContentIntent(ouvrir)
                      .addAction(Notification.Action.Builder(Icon.createWithResource(this, R.drawable.ic_launcher), "Arrêter", stop).build())
                      .setOngoing(true)
                      .build()
                  val type = if (interne)
                      ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION or ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                  else
                      ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                  startForeground(7, n, type)
              }

              // ============================ VOIX ============================
              private fun preparerVoix() {
                  tts = TextToSpeech(this) { st ->
                      val t = tts
                      if (st == TextToSpeech.SUCCESS && t != null) {
                          t.setLanguage(Locale.FRANCE)
                          t.setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ASSISTANCE_ACCESSIBILITY)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                  .build()
                          )
                          t.setSpeechRate(1.15f)
                          ttsPret = true
                      }
                  }
              }

              private fun parler(t: String) {
                  val v = tts ?: return
                  if (!voix || !ttsPret || t.isBlank()) return
                  v.speak(t, TextToSpeech.QUEUE_ADD, null, "t" + SystemClock.elapsedRealtime())
              }

              // ============================ CAPTURE ============================
              @SuppressLint("MissingPermission")
              private fun demarrerCapture(sonInterne: Boolean): Boolean {
                  try {
                      val fmt = AudioFormat.Builder()
                          .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                          .setSampleRate(TAUX)
                          .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                          .build()
                      val min = AudioRecord.getMinBufferSize(TAUX, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                      val b = AudioRecord.Builder()
                          .setAudioFormat(fmt)
                          .setBufferSizeInBytes(maxOf(min * 4, TAUX * 2))
                      if (sonInterne) {
                          val pj = projection ?: return false
                          val cfg = AudioPlaybackCaptureConfiguration.Builder(pj)
                              .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                              .addMatchingUsage(AudioAttributes.USAGE_GAME)
                              .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                              .build()
                          b.setAudioPlaybackCaptureConfig(cfg)
                      } else {
                          b.setAudioSource(MediaRecorder.AudioSource.VOICE_RECOGNITION)
                      }
                      val rec = b.build()
                      if (rec.state != AudioRecord.STATE_INITIALIZED) {
                          rec.release()
                          return false
                      }
                      rec.startRecording()
                      enregistreur = rec
                      captureMicro = !sonInterne
                      captureOn = true
                      val th = Thread({
                          try { android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_DEFAULT) } catch (_: Exception) {}
                          boucleCapture(rec)
                      }, "capture-son")
                      th.start()
                      filCapture = th
                      return true
                  } catch (e: Exception) {
                      return false
                  }
              }

              private fun arreterCapture() {
                  captureOn = false
                  try { filCapture?.join(300) } catch (_: Exception) {}
                  try { enregistreur?.stop() } catch (_: Exception) {}
                  try { enregistreur?.release() } catch (_: Exception) {}
                  enregistreur = null
              }

              // Lit le son par morceaux de 100 ms : filtre de la voix, amplificateur,
              // puis envoi à la reconnaissance sans jamais bloquer.
              private fun boucleCapture(rec: AudioRecord) {
                  val buf = ByteArray(TAUX / 5)
                  val ech = FloatArray(buf.size / 2)
                  var courant: ParcelFileDescriptor? = null
                  var casse = false
                  val pfd = StructPollfd()
                  val tab = arrayOf(pfd)
                  var gain = 1f
                  val haut1 = Filtre.passeHaut(150f, TAUX.toFloat())
                  val haut2 = Filtre.passeHaut(150f, TAUX.toFloat())
                  val bas1 = Filtre.passeBas(3600f, TAUX.toFloat())
                  val bas2 = Filtre.passeBas(3600f, TAUX.toFloat())
                  while (actif && captureOn) {
                      val n = rec.read(buf, 0, buf.size)
                      if (n <= 0) {
                          if (n < 0) SystemClock.sleep(20)
                          continue
                      }
                      val nb = n / 2
                      var crete = 0
                      for (i in 0 until nb) {
                          val s = ((buf[2 * i + 1].toInt() shl 8) or (buf[2 * i].toInt() and 0xFF)).toShort().toInt()
                          ech[i] = bas2.f(bas1.f(haut2.f(haut1.f(s.toFloat()))))
                          val a = abs(ech[i].toInt())
                          if (a > crete) crete = a
                      }
                      if (crete > 500) derniereVoix = SystemClock.elapsedRealtime()
                      val voulu = if (crete > 150) (14000f / crete).coerceIn(1f, 8f) else gain
                      gain = if (voulu < gain) voulu else gain + (voulu - gain) * 0.15f
                      for (i in 0 until nb) {
                          val v = (ech[i] * gain).toInt().coerceIn(-32768, 32767)
                          buf[2 * i] = (v and 0xFF).toByte()
                          buf[2 * i + 1] = ((v shr 8) and 0xFF).toByte()
                      }
                      val voulue = ecriture
                      if (voulue !== courant) {
                          try { courant?.close() } catch (_: Exception) {}
                          courant = voulue
                          casse = false
                      }
                      val w = courant
                      if (w == null || casse) continue
                      try {
                          pfd.fd = w.fileDescriptor
                          pfd.events = OsConstants.POLLOUT.toShort()
                          pfd.revents = 0
                          Os.poll(tab, 0)
                          val r = pfd.revents.toInt()
                          if (r and (OsConstants.POLLERR or OsConstants.POLLHUP or OsConstants.POLLNVAL) != 0) {
                              casse = true
                          } else if (r and OsConstants.POLLOUT != 0) {
                              Os.write(w.fileDescriptor, buf, 0, n)
                          }
                      } catch (e: ErrnoException) {
                          if (e.errno != OsConstants.EAGAIN && e.errno != OsConstants.EINTR) casse = true
                      } catch (e: Exception) {
                          casse = true
                      }
                  }
                  try { courant?.close() } catch (_: Exception) {}
              }

              // ============================ TRADUCTEUR ============================
              private fun preparerTraducteur() {
                  val l = langue
                  val tr = Translation.getClient(
                      TranslatorOptions.Builder().setSourceLanguage(l.code).setTargetLanguage(CIBLE).build()
                  )
                  traducteur = tr
                  tr.downloadModelIfNeeded(DownloadConditions.Builder().build())
                      .addOnSuccessListener {
                          if (traducteur === tr) traducteurPret = true
                      }
                      .addOnFailureListener {
                          if (traducteur === tr && actif) {
                              tvOrig?.text = "Langue pas encore téléchargée. Vérifie Internet..."
                              main.postDelayed({ if (traducteur === tr && actif) preparerTraducteur() }, 8000)
                          }
                      }
              }

              private fun traduire(t: String, ok: (String) -> Unit) {
                  val tr = traducteur
                  if (tr == null || !traducteurPret) {
                      ok("[$t]")
                      return
                  }
                  tr.translate(t)
                      .addOnSuccessListener { r -> ok(r) }
                      .addOnFailureListener { ok("[$t]") }
              }

              // ============================ RECONNAISSANCE ============================
              private fun intentBase(parole: String): Intent {
                  val it = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  it.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  it.putExtra(RecognizerIntent.EXTRA_LANGUAGE, parole)
                  it.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                  it.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1)
                  it.putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, packageName)
                  it.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 800L)
                  it.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, 600L)
                  return it
              }

              private fun demarrerEcoute() {
                  // On reprend directement la méthode d'écoute qui a marché la dernière fois.
                  val connue = reglages.getString("methode", null)
                  strategie = strats.indexOfFirst { cleStrat(it) == connue }.coerceAtLeast(0)
                  resultatsDansStrategie = false
                  erreursSuite = 0
                  videsSuite = 0
                  nouvelleSession()
              }

              private fun nouvelleSession() {
                  main.removeCallbacks(runSession)
                  if (!actif || ecoutePause) return
                  val st = strats[strategie]
                  try {
                      if (!st.parSource && captureMicro && captureOn) arreterCapture()
                      if (reco == null || recoStrat != st) {
                          try { reco?.destroy() } catch (_: Exception) {}
                          reco = if (st.surAppareil && Build.VERSION.SDK_INT >= 31)
                              SpeechRecognizer.createOnDeviceSpeechRecognizer(this)
                          else
                              SpeechRecognizer.createSpeechRecognizer(this)
                          reco?.setRecognitionListener(ecouteur)
                          recoStrat = st
                      }
                      val it = intentBase(tag(langue))
                      val ancienne = lecture
                      if (st.parSource && Build.VERSION.SDK_INT >= 33 && captureOn) {
                          val p = ParcelFileDescriptor.createPipe()
                          lecture = p[0]
                          ecriture = p[1]
                          it.putExtra(RecognizerIntent.EXTRA_AUDIO_SOURCE, p[0])
                          it.putExtra(RecognizerIntent.EXTRA_AUDIO_SOURCE_CHANNEL_COUNT, 1)
                          it.putExtra(RecognizerIntent.EXTRA_AUDIO_SOURCE_ENCODING, AudioFormat.ENCODING_PCM_16BIT)
                          it.putExtra(RecognizerIntent.EXTRA_AUDIO_SOURCE_SAMPLING_RATE, TAUX)
                          if (st.segmente) {
                              it.putExtra(RecognizerIntent.EXTRA_SEGMENTED_SESSION, RecognizerIntent.EXTRA_AUDIO_SOURCE)
                          }
                      } else {
                          ecriture = null
                          lecture = null
                      }
                      try { ancienne?.close() } catch (_: Exception) {}
                      dernierSigne = SystemClock.elapsedRealtime()
                      enCours = true
                      reco?.startListening(it)
                  } catch (e: Exception) {
                      enCours = false
                      gererErreur(SpeechRecognizer.ERROR_CLIENT)
                  }
              }

              private fun relancer(ms: Long) {
                  main.removeCallbacks(runSession)
                  main.postDelayed(runSession, ms)
              }

              private fun texte(b: Bundle?): String? =
                  b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()?.trim()?.takeIf { it.isNotEmpty() }

              private val ecouteur = object : RecognitionListener {
                  override fun onReadyForSpeech(params: Bundle?) {
                      dernierSigne = SystemClock.elapsedRealtime()
                      if (resultatsDansStrategie) couleurBulle(VERT)
                  }
                  override fun onBeginningOfSpeech() { dernierSigne = SystemClock.elapsedRealtime() }
                  override fun onRmsChanged(rmsdB: Float) { dernierSigne = SystemClock.elapsedRealtime() }
                  override fun onBufferReceived(buffer: ByteArray?) {}
                  override fun onEndOfSpeech() {}
                  override fun onEvent(eventType: Int, params: Bundle?) {}

                  override fun onPartialResults(partialResults: Bundle?) {
                      dernierSigne = SystemClock.elapsedRealtime()
                      texte(partialResults)?.let { partiel(it) }
                  }

                  override fun onResults(results: Bundle?) {
                      enCours = false
                      recu(results)
                      relancer(20)
                  }

                  override fun onSegmentResults(segmentResults: Bundle) {
                      dernierSigne = SystemClock.elapsedRealtime()
                      recu(segmentResults)
                  }

                  override fun onEndOfSegmentedSession() {
                      enCours = false
                      relancer(20)
                  }

                  override fun onError(error: Int) {
                      enCours = false
                      gererErreur(error)
                  }
              }

              private fun recu(b: Bundle?) {
                  val t = texte(b) ?: return
                  if (!resultatsDansStrategie) {
                      strats.getOrNull(strategie)?.let { reglages.edit().putString("methode", cleStrat(it)).apply() }
                  }
                  resultatsDansStrategie = true
                  erreursSuite = 0
                  videsSuite = 0
                  couleurBulle(VERT)
                  finale(t)
              }

              private fun changerDeMethode(message: String?) {
                  strategie++
                  erreursSuite = 0
                  videsSuite = 0
                  resultatsDansStrategie = false
                  try { reco?.destroy() } catch (_: Exception) {}
                  reco = null
                  if (message != null) info(message)
                  couleurBulle(ORANGE)
                  relancer(150)
              }

              private fun gererErreur(code: Int) {
                  if (!actif || ecoutePause) return
                  val dernier = strategie >= strats.size - 1
                  when (code) {
                      SpeechRecognizer.ERROR_NO_MATCH, SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> {
                          // Le moteur ne comprend rien alors que le son passe : on change de méthode.
                          videsSuite++
                          val sonPresent = SystemClock.elapsedRealtime() - derniereVoix < 4000
                          if (!resultatsDansStrategie && !dernier && videsSuite >= 4 && sonPresent) {
                              val vers = strats[strategie + 1]
                              changerDeMethode(if (!vers.parSource) "J'écoute maintenant par le micro : monte le volume du live." else null)
                              return
                          }
                          relancer(20)
                          return
                      }
                      SpeechRecognizer.ERROR_RECOGNIZER_BUSY -> {
                          try { reco?.destroy() } catch (_: Exception) {}
                          reco = null
                          relancer(400)
                          return
                      }
                      SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS -> {
                          couleurBulle(ROUGE)
                          info("Autorisation micro refusée. Ouvre Lushi Traducteur pour l'accorder.")
                          return
                      }
                  }
                  // Code de langue refusé (ex. chinois) : on essaie l'autre code.
                  if ((code == 12 || code == 13) && langue.autre.isNotEmpty() && tagEfficace[langue.code] != langue.autre) {
                      tagEfficace[langue.code] = langue.autre
                      relancer(100)
                      return
                  }
                  erreursSuite++
                  val grave = code == 3 || code == 5 || code == 11 || code == 12 || code == 13 || code == 14
                  if (!resultatsDansStrategie && !dernier && (grave || erreursSuite >= 3)) {
                      val vers = strats[strategie + 1]
                      changerDeMethode(if (!vers.parSource) "J'écoute maintenant par le micro : monte le volume du live." else null)
                      return
                  }
                  if (code == SpeechRecognizer.ERROR_NETWORK || code == SpeechRecognizer.ERROR_NETWORK_TIMEOUT || code == SpeechRecognizer.ERROR_SERVER) {
                      tvOrig?.text = "Connexion faible..."
                  }
                  if (erreursSuite >= 6) couleurBulle(ROUGE)
                  relancer(if (erreursSuite > 5) 1500L else 250L)
              }

              // ============================ AFFICHAGE ============================
              // À chaque pause de la personne, la phrase en cours devient une ligne.
              private fun poserPause() {
                  if (!actif || partielTrad.isEmpty()) return
                  lignes.addLast(partielTrad)
                  while (lignes.size > 3) lignes.removeFirst()
                  partielTrad = ""
                  ligneDePause = true
                  rafraichir()
                  glisser()
              }

              private fun partiel(t: String) {
                  tvOrig?.text = t
                  main.removeCallbacks(validerPause)
                  main.postDelayed(validerPause, 1300)
                  if (ligneDePause && lignes.isNotEmpty()) {
                      lignes.removeLast()
                      ligneDePause = false
                  }
                  val now = SystemClock.elapsedRealtime()
                  if (now - dernierPartiel < 450) return
                  dernierPartiel = now
                  val seq = ++seqPartiel
                  traduire(t) { r ->
                      if (seq == seqPartiel && actif) {
                          partielTrad = r
                          rafraichir()
                      }
                  }
              }

              private fun finale(t: String) {
                  tvOrig?.text = t
                  val seq = ++seqPartiel
                  traduire(t) { r ->
                      if (!actif) return@traduire
                      if (seq == seqPartiel) partielTrad = ""
                      main.removeCallbacks(validerPause)
                      if (ligneDePause && lignes.isNotEmpty()) lignes.removeLast()
                      ligneDePause = false
                      if (lignes.lastOrNull() == r) return@traduire
                      lignes.addLast(r)
                      while (lignes.size > 3) lignes.removeFirst()
                      rafraichir()
                      glisser()
                      parler(r)
                  }
              }

              private fun glisser() {
                  val v = tvTrad ?: return
                  v.animate().cancel()
                  v.alpha = 0.55f
                  v.translationY = dp(8f).toFloat()
                  v.animate().alpha(1f).translationY(0f).setDuration(220).start()
              }

              private fun rafraichir() {
                  val sb = SpannableStringBuilder()
                  lignes.forEachIndexed { i, l ->
                      val debut = sb.length
                      sb.append(l)
                      if (i < lignes.size - 1 || partielTrad.isNotEmpty()) sb.append('\n')
                      val c = if (i == lignes.size - 1 && partielTrad.isEmpty()) Color.WHITE else 0xB3FFFFFF.toInt()
                      sb.setSpan(ForegroundColorSpan(c), debut, sb.length, 0)
                  }
                  if (partielTrad.isNotEmpty()) {
                      val d = sb.length
                      sb.append(partielTrad)
                      sb.setSpan(ForegroundColorSpan(0xFF80FFE8.toInt()), d, sb.length, 0)
                  }
                  tvTrad?.text = sb
              }

              private fun couleurBulle(c: Int) {
                  (bulle?.background as? GradientDrawable)?.setStroke(dp(4f), c)
              }

              private fun info(m: String) {
                  tvOrig?.text = m
                  Toast.makeText(this, m, Toast.LENGTH_LONG).show()
              }

              // ======================== FENETRES FLOTTANTES ========================
              @SuppressLint("ClickableViewAccessibility")
              private fun rendreDeplacable(
                  poignee: View, fenetre: View, lp: WindowManager.LayoutParams,
                  auToucher: (() -> Unit)?, auDehors: (() -> Unit)? = null
              ) {
                  var ox = 0
                  var oy = 0
                  var tx = 0f
                  var ty = 0f
                  var bouge = false
                  poignee.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              ox = lp.x; oy = lp.y; tx = e.rawX; ty = e.rawY; bouge = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - tx
                              val dy = e.rawY - ty
                              if (abs(dx) > 12f || abs(dy) > 12f) bouge = true
                              if (bouge) {
                                  val ecran = resources.displayMetrics
                                  val largeur = if (fenetre.width > 0) fenetre.width else dp(58f)
                                  val hauteur = if (fenetre.height > 0) fenetre.height else dp(58f)
                                  lp.x = (ox + dx.toInt()).coerceIn(0, maxOf(0, ecran.widthPixels - largeur))
                                  lp.y = (oy + dy.toInt()).coerceIn(0, maxOf(0, ecran.heightPixels - hauteur))
                                  try { wm.updateViewLayout(fenetre, lp) } catch (_: Exception) {}
                              }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!bouge) auToucher?.invoke()
                              true
                          }
                          MotionEvent.ACTION_OUTSIDE -> {
                              auDehors?.invoke()
                              false
                          }
                          else -> false
                      }
                  }
              }

              private fun creerBulle() {
                  val cote = dp(58f)
                  val b = ImageView(this)
                  b.setImageResource(R.drawable.ic_launcher)
                  b.scaleType = ImageView.ScaleType.FIT_CENTER
                  b.setPadding(dp(5f), dp(5f), dp(5f), dp(5f))
                  val rond = GradientDrawable()
                  rond.shape = GradientDrawable.OVAL
                  rond.setColor(0x33000000)
                  rond.setStroke(dp(4f), GRIS)
                  b.background = rond
                  b.elevation = dp(6f).toFloat()
                  val lp = WindowManager.LayoutParams(
                      cote, cote,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = dp(8f)
                  lp.y = dp(170f)
                  rendreDeplacable(b, b, lp) { basculerPanneau() }
                  wm.addView(b, lp)
                  bulle = b
              }

              private fun bouton(t: String, action: () -> Unit): TextView {
                  val v = TextView(this)
                  v.text = t
                  v.setTextColor(0xFFE3E8FF.toInt())
                  v.textSize = 14f
                  v.gravity = Gravity.CENTER
                  v.background = fond(0x26FFFFFF, dp(14f).toFloat())
                  v.setPadding(dp(10f), dp(4f), dp(10f), dp(4f))
                  v.setOnClickListener { action() }
                  return v
              }

              private fun hautBas() {
                  val p = panneau ?: return
                  val lp = lpPanneau ?: return
                  val ecran = resources.displayMetrics
                  val haut = (ecran.heightPixels * 0.10f).toInt()
                  val bas = maxOf(0, ecran.heightPixels - p.height - dp(150f))
                  lp.y = if (lp.y > ecran.heightPixels / 2) haut else bas
                  try { wm.updateViewLayout(p, lp) } catch (_: Exception) {}
              }

              private fun creerPanneau() {
                  val pad = dp(12f)
                  val pn = LinearLayout(this)
                  pn.orientation = LinearLayout.VERTICAL
                  pn.setPadding(pad, dp(8f), pad, dp(10f))
                  val verre = GradientDrawable()
                  verre.setColor(0xE60D1222.toInt())
                  verre.cornerRadius = dp(18f).toFloat()
                  verre.setStroke(dp(1f), 0x6680FFE8)
                  pn.background = verre
                  pn.elevation = dp(10f).toFloat()

                  val poignee = View(this)
                  poignee.background = fond(0x66FFFFFF, dp(3f).toFloat())
                  val lpPoignee = LinearLayout.LayoutParams(dp(40f), dp(4f))
                  lpPoignee.gravity = Gravity.CENTER_HORIZONTAL
                  lpPoignee.bottomMargin = dp(6f)
                  pn.addView(poignee, lpPoignee)

                  val entete = LinearLayout(this)
                  entete.orientation = LinearLayout.HORIZONTAL
                  entete.gravity = Gravity.CENTER_VERTICAL
                  val titre = TextView(this)
                  titre.text = "${langue.nom} > Français"
                  titre.setTextColor(0xFF0D1222.toInt())
                  titre.textSize = 11f
                  titre.setTypeface(null, Typeface.BOLD)
                  titre.isSingleLine = true
                  titre.ellipsize = TextUtils.TruncateAt.END
                  titre.background = fond(0xFF80FFE8.toInt(), dp(10f).toFloat())
                  titre.setPadding(dp(8f), dp(2f), dp(8f), dp(2f))
                  val lpTitre = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  lpTitre.rightMargin = dp(6f)
                  entete.addView(titre, lpTitre)
                  fun ajouter(v: TextView) {
                      val l = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      l.leftMargin = dp(4f)
                      entete.addView(v, l)
                  }
                  ajouter(bouton("✍️") { ouvrirBarre() })
                  ajouter(bouton("📌") { hautBas() })
                  ajouter(bouton("A-") { changerTaille(-2f) })
                  ajouter(bouton("A+") { changerTaille(2f) })
                  ajouter(bouton("▾") { basculerPanneau() })
                  ajouter(bouton("✕") { stopSelf() })

                  val trad = TextView(this)
                  trad.setTextColor(Color.WHITE)
                  trad.textSize = taille
                  trad.setTypeface(null, Typeface.BOLD)
                  trad.setShadowLayer(4f, 0f, 1f, Color.BLACK)
                  trad.setLineSpacing(0f, 1.15f)
                  trad.minLines = 3
                  trad.maxLines = 5
                  trad.gravity = Gravity.BOTTOM or Gravity.START
                  trad.setPadding(0, dp(8f), 0, 0)
                  trad.text = "J'écoute... lance la vidéo."

                  val orig = TextView(this)
                  orig.setTextColor(0xFF9AA4C8.toInt())
                  orig.textSize = 12f
                  orig.setTypeface(null, Typeface.ITALIC)
                  orig.isSingleLine = true
                  orig.ellipsize = TextUtils.TruncateAt.START
                  orig.setPadding(0, dp(6f), 0, 0)

                  pn.addView(entete)
                  pn.addView(trad)
                  pn.addView(orig)

                  val ecran = resources.displayMetrics
                  val lp = WindowManager.LayoutParams(
                      ecran.widthPixels - dp(16f),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = dp(8f)
                  lp.y = (ecran.heightPixels * 0.10f).toInt()
                  rendreDeplacable(pn, pn, lp, null)
                  wm.addView(pn, lp)
                  panneau = pn
                  lpPanneau = lp
                  tvTitre = titre
                  tvTrad = trad
                  tvOrig = orig
              }

              private fun basculerPanneau() {
                  val p = panneau ?: return
                  p.visibility = if (p.visibility == View.VISIBLE) View.GONE else View.VISIBLE
              }

              private fun changerTaille(d: Float) {
                  taille = (taille + d).coerceIn(12f, 34f)
                  tvTrad?.textSize = taille
              }

              // ======================== REPONDRE ========================
              // Mon message en français (écrit ou parlé) devient du texte dans la langue
              // du live, copié tout seul pour être collé dans le chat.
              private var barre: LinearLayout? = null
              private var lpBarre: WindowManager.LayoutParams? = null
              private var etMessage: EditText? = null
              private var tvResultat: TextView? = null
              private var traducteurRetour: Translator? = null
              private var recoVoix: SpeechRecognizer? = null
              @Volatile private var ecoutePause = false
              private val tradAuto = Runnable { traduireMessage() }
              private val copieAuto = Runnable { copierResultat(false) }
              private var dicteeMicro = false

              private fun grosBouton(t: String, couleur: Int, action: () -> Unit): TextView {
                  val v = TextView(this)
                  v.text = t
                  v.setTextColor(Color.WHITE)
                  v.textSize = 15f
                  v.setTypeface(null, Typeface.BOLD)
                  v.gravity = Gravity.CENTER
                  v.minHeight = dp(50f)
                  v.background = fond(couleur, dp(14f).toFloat())
                  v.setPadding(dp(8f), dp(6f), dp(8f), dp(6f))
                  v.setOnClickListener { action() }
                  return v
              }

              private fun rangee(a: View, b: View): LinearLayout {
                  val l = LinearLayout(this)
                  l.orientation = LinearLayout.HORIZONTAL
                  val p1 = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  p1.rightMargin = dp(8f)
                  l.addView(a, p1)
                  l.addView(b, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  return l
              }

              private fun ouvrirBarre() {
                  if (barre != null) {
                      fermerBarre()
                      return
                  }
                  val pad = dp(12f)
                  val br = LinearLayout(this)
                  br.orientation = LinearLayout.VERTICAL
                  br.setPadding(pad, dp(10f), pad, dp(12f))
                  val verre = GradientDrawable()
                  verre.setColor(0xF2141A30.toInt())
                  verre.cornerRadius = dp(18f).toFloat()
                  verre.setStroke(dp(1f), 0x66FFD54F)
                  br.background = verre
                  br.elevation = dp(12f).toFloat()

                  val titre = TextView(this)
                  titre.text = "Écris en français : traduit en ${langue.nom} et copié tout seul"
                  titre.setTextColor(0xFF141A30.toInt())
                  titre.textSize = 12f
                  titre.setTypeface(null, Typeface.BOLD)
                  titre.background = fond(0xFFFFD54F.toInt(), dp(10f).toFloat())
                  titre.setPadding(dp(8f), dp(3f), dp(8f), dp(3f))
                  br.addView(titre)

                  val et = EditText(this)
                  et.hint = "Écris ici, ou touche 🎤 Parler"
                  et.setHintTextColor(0xFF7F88AA.toInt())
                  et.setTextColor(Color.WHITE)
                  et.textSize = 16f
                  et.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE or InputType.TYPE_TEXT_FLAG_CAP_SENTENCES
                  et.maxLines = 3
                  et.background = fond(0x22FFFFFF, dp(12f).toFloat())
                  et.setPadding(dp(10f), dp(8f), dp(10f), dp(8f))
                  et.setOnTouchListener { _, _ ->
                      rendreFocusable(true)
                      false
                  }
                  // Traduction automatique pendant que j'écris : aucun bouton à toucher.
                  et.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                      override fun afterTextChanged(s: Editable?) {
                          main.removeCallbacks(tradAuto)
                          main.removeCallbacks(copieAuto)
                          if (s.isNullOrBlank()) {
                              tvResultat?.text = "La traduction apparaîtra ici."
                          } else {
                              main.postDelayed(tradAuto, 500)
                          }
                      }
                  })
                  val lpEt = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  lpEt.topMargin = dp(8f)
                  br.addView(et, lpEt)

                  val bParler = grosBouton("🎤 Parler", 0xFFE53935.toInt()) { dicter() }
                  val bFermer = grosBouton("✕ Fermer", 0xFF455A64.toInt()) { fermerBarre() }
                  br.addView(rangee(bParler, bFermer), LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).also { it.topMargin = dp(8f) })

                  val res = TextView(this)
                  res.setTextColor(0xFFFFE082.toInt())
                  res.textSize = 17f
                  res.setTextIsSelectable(true)
                  res.setPadding(0, dp(10f), 0, 0)
                  res.text = "La traduction apparaîtra ici."
                  br.addView(res)

                  val ecran = resources.displayMetrics
                  val lp = WindowManager.LayoutParams(
                      ecran.widthPixels - dp(16f),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = dp(8f)
                  lp.y = (ecran.heightPixels * 0.30f).toInt()
                  lp.softInputMode = WindowManager.LayoutParams.SOFT_INPUT_STATE_VISIBLE or WindowManager.LayoutParams.SOFT_INPUT_ADJUST_PAN
                  rendreDeplacable(br, br, lp, null) { rendreFocusable(false) }
                  try {
                      wm.addView(br, lp)
                  } catch (e: Exception) {
                      return
                  }
                  barre = br
                  lpBarre = lp
                  etMessage = et
                  tvResultat = res
                  main.postDelayed({
                      et.requestFocus()
                      getSystemService(InputMethodManager::class.java)?.showSoftInput(et, InputMethodManager.SHOW_IMPLICIT)
                  }, 250)
              }

              // Une fois le texte copié, la barre lâche le clavier pour qu'on écrive dans le live.
              private fun rendreFocusable(oui: Boolean) {
                  val br = barre ?: return
                  val lp = lpBarre ?: return
                  val avant = lp.flags
                  lp.flags = if (oui) WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH
                  else WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                  if (lp.flags != avant) {
                      try { wm.updateViewLayout(br, lp) } catch (_: Exception) {}
                  }
                  if (!oui) {
                      etMessage?.let { getSystemService(InputMethodManager::class.java)?.hideSoftInputFromWindow(it.windowToken, 0) }
                  }
              }

              private fun traduireMessage() {
                  val texte = etMessage?.text?.toString()?.trim() ?: ""
                  if (texte.isEmpty()) return
                  val l = langue
                  if (traducteurRetour == null) {
                      traducteurRetour = Translation.getClient(
                          TranslatorOptions.Builder().setSourceLanguage(CIBLE).setTargetLanguage(l.code).build()
                      )
                  }
                  val tr = traducteurRetour ?: return
                  tr.downloadModelIfNeeded(DownloadConditions.Builder().build())
                      .addOnSuccessListener {
                          tr.translate(texte)
                              .addOnSuccessListener { r ->
                                  // On n'affiche que si le texte n'a pas changé entre-temps.
                                  if (etMessage?.text?.toString()?.trim() == texte) montrerResultat(r)
                              }
                              .addOnFailureListener { tvResultat?.text = "Traduction impossible. Réessaie." }
                      }
                      .addOnFailureListener { tvResultat?.text = "Téléchargement de la langue impossible. Vérifie Internet." }
              }

              private fun montrerResultat(r: String) {
                  tvResultat?.text = r
                  // Copie automatique quand j'arrête d'écrire un instant.
                  main.removeCallbacks(copieAuto)
                  main.postDelayed(copieAuto, 900)
              }

              private var dernierCopie = ""

              private fun copierResultat(avecMessage: Boolean) {
                  val r = tvResultat?.text?.toString() ?: return
                  if (r.isBlank() || r.startsWith("La traduction apparaîtra") || r.startsWith("🎤") ||
                      r.startsWith("Je n'") || r.startsWith("Micro") || r.startsWith("Téléchargement") || r.startsWith("Traduction impossible")) return
                  if (r == dernierCopie && !avecMessage) return
                  val cm = getSystemService(ClipboardManager::class.java) ?: return
                  cm.setPrimaryClip(ClipData.newPlainText("Lushi Traducteur", r))
                  dernierCopie = r
                  tvResultat?.setTextColor(0xFF80FFE8.toInt())
                  main.postDelayed({ tvResultat?.setTextColor(0xFFFFE082.toInt()) }, 400)
                  if (avecMessage) Toast.makeText(this, "Copié ! Colle-le dans le chat du live.", Toast.LENGTH_SHORT).show()
              }

              // Je parle en français : l'écoute du live se met en pause le temps de ma phrase.
              private fun dicter() {
                  if (recoVoix != null) {
                      finDictee()
                      return
                  }
                  ecoutePause = true
                  main.removeCallbacks(runSession)
                  try { reco?.cancel() } catch (_: Exception) {}
                  enCours = false
                  ecriture = null
                  dicteeMicro = captureMicro && captureOn
                  if (dicteeMicro) arreterCapture()
                  tvResultat?.text = "🎤 Parle en français, je t'écoute..."
                  try {
                      val r = SpeechRecognizer.createSpeechRecognizer(this)
                      recoVoix = r
                      r.setRecognitionListener(object : RecognitionListener {
                          override fun onReadyForSpeech(params: Bundle?) {}
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(rmsdB: Float) {}
                          override fun onBufferReceived(buffer: ByteArray?) {}
                          override fun onEndOfSpeech() {}
                          override fun onEvent(eventType: Int, params: Bundle?) {}
                          override fun onPartialResults(partialResults: Bundle?) {
                              texte(partialResults)?.let { etMessage?.setText(it) }
                          }
                          override fun onResults(results: Bundle?) {
                              val t = texte(results)
                              finDictee()
                              if (t != null) {
                                  etMessage?.setText(t)
                                  etMessage?.setSelection(t.length)
                              } else {
                                  tvResultat?.text = "Je n'ai pas entendu. Touche 🎤 et réessaie."
                              }
                          }
                          override fun onError(error: Int) {
                              finDictee()
                              tvResultat?.text = "Je n'ai pas compris. Touche 🎤 et réessaie."
                          }
                      })
                      r.startListening(intentBase("fr-FR"))
                  } catch (e: Exception) {
                      finDictee()
                      tvResultat?.text = "Micro indisponible."
                  }
              }

              private fun finDictee() {
                  try { recoVoix?.destroy() } catch (_: Exception) {}
                  recoVoix = null
                  if (dicteeMicro) {
                      dicteeMicro = false
                      demarrerCapture(false)
                  }
                  if (ecoutePause) {
                      ecoutePause = false
                      relancer(200)
                  }
              }

              private fun fermerBarre() {
                  val br = barre ?: return
                  etMessage?.let { getSystemService(InputMethodManager::class.java)?.hideSoftInputFromWindow(it.windowToken, 0) }
                  try { wm.removeView(br) } catch (_: Exception) {}
                  barre = null
                  lpBarre = null
                  etMessage = null
                  tvResultat = null
              }

              override fun onDestroy() {
                  main.removeCallbacks(tradAuto)
                  main.removeCallbacks(copieAuto)
                  fermerBarre()
                  try { recoVoix?.destroy() } catch (_: Exception) {}
                  try { traducteurRetour?.close() } catch (_: Exception) {}
                  actif = false
                  captureOn = false
                  main.removeCallbacksAndMessages(null)
                  try { reco?.destroy() } catch (_: Exception) {}
                  reco = null
                  ecriture = null
                  try { lecture?.close() } catch (_: Exception) {}
                  try { filCapture?.join(300) } catch (_: Exception) {}
                  try { enregistreur?.stop() } catch (_: Exception) {}
                  try { enregistreur?.release() } catch (_: Exception) {}
                  try { projection?.stop() } catch (_: Exception) {}
                  if (::wm.isInitialized) {
                      bulle?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                      panneau?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  }
                  try { traducteur?.close() } catch (_: Exception) {}
                  try { tts?.shutdown() } catch (_: Exception) {}
                  super.onDestroy()
              }
          }
          LUSHI_FIN


      - name: Fabriquer l'APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cle.jks"
            export KS_FILE="$RUNNER_TEMP/cle.jks"
            export KS_ALIAS=$(keytool -list -keystore "$KS_FILE" -storepass "$KS_PASS" 2>/dev/null | grep -i PrivateKeyEntry | head -1 | cut -d, -f1)
            echo "Signature avec la cle LushiPratique (alias: $KS_ALIAS)"
          else
            echo "Pas de cle dans les secrets : APK signe avec la cle de test."
          fi
          gradle -p proj assembleRelease --no-daemon
          cp proj/app/build/outputs/apk/release/app-release.apk lushi-traducteur.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lushi-traducteur-apk
          path: lushi-traducteur.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.${{ github.run_number }}
          name: Lushi Traducteur v5.${{ github.run_number }}
          files: lushi-traducteur.apk
