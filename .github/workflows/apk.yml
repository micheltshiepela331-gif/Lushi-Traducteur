          const val CIBLE = "fr"

          fun Context.dp(v: Float): Int =
              TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, resources.displayMetrics).toInt()

          fun fond(couleur: Int, rayon: Float): GradientDrawable =
              GradientDrawable().apply { setColor(couleur); cornerRadius = rayon }

          // Filtre audio simple : garde la bande de la voix, atténue la musique de fond.
          class Filtre(private val b0: Float, private val b1: Float, private val b2: Float,
                       private val a1: Float, private val a2: Float) {
              private var x1 = 0f
              private var x2 = 0f
              private var y1 = 0f
              private var y2 = 0f
              fun f(x: Float): Float {
                  val y = b0 * x + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2
                  x2 = x1; x1 = x; y2 = y1; y1 = y
                  return y
              }
              companion object {
                  fun passeHaut(fc: Float, fs: Float): Filtre {
                      val w = 2.0 * Math.PI * fc / fs
                      val c = Math.cos(w); val al = Math.sin(w) / (2 * 0.707)
                      val a0 = 1 + al
                      return Filtre(((1 + c) / 2 / a0).toFloat(), (-(1 + c) / a0).toFloat(), ((1 + c) / 2 / a0).toFloat(),
                          (-2 * c / a0).toFloat(), ((1 - al) / a0).toFloat())
                  }
                  fun passeBas(fc: Float, fs: Float): Filtre {
                      val w = 2.0 * Math.PI * fc / fs
                      val c = Math.cos(w); val al = Math.sin(w) / (2 * 0.707)
                      val a0 = 1 + al
                      return Filtre(((1 - c) / 2 / a0).toFloat(), ((1 - c) / a0).toFloat(), ((1 - c) / 2 / a0).toFloat(),
                          (-2 * c / a0).toFloat(), ((1 - al) / a0).toFloat())
                  }
              }
          }

          // =====================================================================
          //  ECRAN DE REGLAGE
          // =====================================================================
          class MainActivity : Activity() {
              private lateinit var spSource: Spinner
              private lateinit var rbInterne: RadioButton
              private lateinit var swVoix: Switch
              private lateinit var tvEtat: TextView
              private val prefs by lazy { getSharedPreferences("lushi", Context.MODE_PRIVATE) }

              private fun etiquette(t: String): TextView {
                  val v = TextView(this)
                  v.text = t
                  v.textSize = 14f
                  v.setTypeface(null, Typeface.BOLD)
                  v.setTextColor(BLEU)
                  v.setPadding(0, dp(14f), 0, dp(4f))
                  return v
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val p = dp(18f)
                  val racine = LinearLayout(this)
                  racine.orientation = LinearLayout.VERTICAL
                  racine.setPadding(p, p, p, p)
                  racine.setBackgroundColor(0xFFF1F4FF.toInt())

                  val titre = TextView(this)
                  titre.text = "Lushi Traducteur"
                  titre.textSize = 26f
                  titre.setTypeface(null, Typeface.BOLD)
                  titre.setTextColor(BLEU)
                  racine.addView(titre)

                  val sous = TextView(this)
                  sous.text = "Le son des lives, traduit en français.\nLushiPratique - la technologie au service de la cité"
                  sous.textSize = 13f
                  sous.setTextColor(0xFF555A75.toInt())
                  sous.setPadding(0, dp(4f), 0, dp(8f))
                  racine.addView(sous)

                  racine.addView(etiquette("Langue du live"))
                  spSource = Spinner(this)
                  spSource.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, LANGUES.map { it.nom })
                  spSource.setSelection(prefs.getInt("src5", 0).coerceIn(0, LANGUES.size - 1))
                  racine.addView(spSource)

                  val cible = TextView(this)
                  cible.text = "Traduction : en français"
                  cible.textSize = 14f
                  cible.setTextColor(0xFF1B5E20.toInt())
                  cible.setPadding(0, dp(8f), 0, 0)
                  racine.addView(cible)

                  racine.addView(etiquette("Comment écouter"))
                  val rg = RadioGroup(this)
                  rbInterne = RadioButton(this)
                  rbInterne.id = View.generateViewId()
                  rbInterne.text = "Son du téléphone (recommandé)"
                  val rbMicro = RadioButton(this)
                  rbMicro.id = View.generateViewId()
                  rbMicro.text = "Micro (le son doit sortir du haut-parleur)"
                  rg.addView(rbInterne)
                  rg.addView(rbMicro)
                  if (prefs.getBoolean("micro", false)) rbMicro.isChecked = true else rbInterne.isChecked = true
                  racine.addView(rg)

                  swVoix = Switch(this)
                  swVoix.text = "Lire la traduction à voix haute"
                  swVoix.isChecked = prefs.getBoolean("voix", false)
                  swVoix.setPadding(0, dp(14f), 0, dp(10f))
                  racine.addView(swVoix)

                  val bt = Button(this)
                  bt.text = "LANCER LA BULLE"
                  bt.textSize = 18f
                  bt.setTextColor(Color.WHITE)
                  bt.background = fond(TURQUOISE, dp(14f).toFloat())
                  bt.setOnClickListener { lancer() }
                  val lpBt = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(58f))
                  lpBt.topMargin = dp(10f)
                  racine.addView(bt, lpBt)

                  val btStop = Button(this)
                  btStop.text = "Arrêter la bulle"
                  btStop.setTextColor(Color.WHITE)
                  btStop.background = fond(BLEU, dp(14f).toFloat())
                  btStop.setOnClickListener {
                      stopService(Intent(this, BulleService::class.java))
                      etat("Bulle arrêtée.")
                  }
                  val lpStop = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(48f))
                  lpStop.topMargin = dp(10f)
                  racine.addView(btStop, lpStop)

                  tvEtat = TextView(this)
                  tvEtat.textSize = 14f
                  tvEtat.setTextColor(0xFF1B5E20.toInt())
                  tvEtat.setPadding(0, dp(14f), 0, dp(6f))
                  racine.addView(tvEtat)

                  val aide = TextView(this)
                  aide.text = "Comment faire :\n" +
                      "1. Choisis la langue du live.\n" +
                      "2. Appuie sur LANCER LA BULLE et accepte les autorisations.\n" +
                      "3. Ouvre le live : la bulle flotte au-dessus.\n" +
                      "4. Touche la bulle pour montrer ou cacher les sous-titres. Glisse-la où tu veux.\n" +
                      "5. Glisse le panneau avec le doigt pour le placer où tu veux.\n" +
                      "6. Pour répondre : touche ✍️ dans le panneau et écris en français. La traduction se fait et se copie toute seule : colle-la dans le chat.\n\n" +
                      "Anneau de la bulle : vert = je traduis, orange = je prépare, rouge = problème.\n" +
                      "Pour changer de langue : Arrêter la bulle, choisir la langue, puis LANCER."
                  aide.textSize = 13f
