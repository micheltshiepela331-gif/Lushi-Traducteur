                  val arret = grosBouton("✕ Arrêter", 0xFFC62828.toInt()) { stopSelf() }
                  m.addView(rangee(voixBt, arret), LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).also { it.topMargin = dp(8f) })

