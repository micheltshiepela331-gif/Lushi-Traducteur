# =====================================================================
#  LUSHI TRADUCTEUR - LushiPratique - fichier unique
#  Ce seul fichier contient TOUTE l'application (code + reglages).
#  A mettre dans le depot GitHub ici :  .github/workflows/apk.yml
#  Puis : onglet Actions -> "APK Lushi Traducteur" -> Run workflow.
#  L'APK apparait dans l'onglet Releases (lushi-traducteur.apk).
# =====================================================================
name: APK Lushi Traducteur

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  construire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Creer le projet Android
        run: |
          mkdir -p proj/app/src/main/java/com/lushipratique/traducteur proj/app/src/main/res/drawable
          cat > proj/settings.gradle <<'LUSHI_FIN'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'LushiTraducteur'
          include ':app'
          LUSHI_FIN
          cat > proj/build.gradle <<'LUSHI_FIN'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          LUSHI_FIN
          cat > proj/gradle.properties <<'LUSHI_FIN'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          kotlin.code.style=official
          LUSHI_FIN
          cat > proj/app/build.gradle <<'LUSHI_FIN'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.lushipratique.traducteur'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.lushipratique.traducteur'
                  minSdk 29
                  targetSdk 33
                  versionCode 7
                  versionName '4.0'
                  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
              }
              signingConfigs {
                  release {
                      if (System.getenv('KS_FILE')) {
                          storeFile file(System.getenv('KS_FILE'))
                          storePassword System.getenv('KS_PASS')
                          keyAlias System.getenv('KS_ALIAS')
                          keyPassword System.getenv('KS_PASS')
                      }
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig System.getenv('KS_FILE') ? signingConfigs.release : signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              lint { checkReleaseBuilds false; abortOnError false }
          }
          dependencies {
              implementation 'com.google.mlkit:translate:17.0.3'
              implementation 'net.java.dev.jna:jna:5.13.0@aar'
              implementation group: 'com.alphacephei', name: 'vosk-android', version: '0.3.47', ext: 'aar'
              implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
              implementation 'com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.1'
              implementation 'com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.1'
              implementation 'com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.1'
              implementation 'com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.1'
          }
          LUSHI_FIN
          cat > proj/app/src/main/AndroidManifest.xml <<'LUSHI_FIN'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
