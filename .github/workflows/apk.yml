              // ---------- petits outils d'affichage : grands boutons faciles à toucher ----------
              private fun grosBouton(t: String, couleur: Int, action: () -> Unit): TextView {
                  val v = TextView(this)
                  v.text = t
                  v.setTextColor(Color.WHITE)
                  v.textSize = 15f
                  v.setTypeface(null, Typeface.BOLD)
                  v.gravity = Gravity.CENTER
                  v.minHeight = dp(50f)
                  v.background = fond(couleur, dp(14f).toFloat())
                  v.setPadding(dp(8f), dp(6f), dp(8f), dp(6f))
                  v.setOnClickListener { action() }
                  return v
              }

              private fun rangee(a: View, b: View): LinearLayout {
                  val l = LinearLayout(this)
                  l.orientation = LinearLayout.HORIZONTAL
                  val p1 = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  p1.rightMargin = dp(8f)
                  l.addView(a, p1)
                  l.addView(b, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  return l
              }

              private fun rangeeChips(noms: List<String>, choisi: Int, auChoix: (Int) -> Unit): HorizontalScrollView {
                  val defil = HorizontalScrollView(this)
                  defil.isHorizontalScrollBarEnabled = false
                  val ligne = LinearLayout(this)
                  ligne.orientation = LinearLayout.HORIZONTAL
                  val vues = mutableListOf<TextView>()
                  fun peindre(sel: Int) {
                      vues.forEachIndexed { i, v ->
                          v.background = fond(if (i == sel) 0xFF80FFE8.toInt() else 0x26FFFFFF, dp(16f).toFloat())
                          v.setTextColor(if (i == sel) 0xFF0D1222.toInt() else Color.WHITE)
                      }
                  }
                  noms.forEachIndexed { i, n ->
                      val v = TextView(this)
                      v.text = n
                      v.textSize = 14f
                      v.minHeight = dp(40f)
                      v.gravity = Gravity.CENTER
                      v.setPadding(dp(14f), dp(6f), dp(14f), dp(6f))
                      v.setOnClickListener {
                          peindre(i)
                          auChoix(i)
                      }
                      val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      lp.rightMargin = dp(6f)
                      ligne.addView(v, lp)
                      vues.add(v)
                  }
                  peindre(choisi)
                  defil.addView(ligne)
                  return defil
              }

              // ---------- je parle en français ----------
              private fun dicter() {
                  if (recoVoix != null) {
                      finDictee()
                      return
                  }
                  dicteeReprendre = ecouteActive
                  arreterEcoute()
                  dicteeMicro = captureMicro && captureOn
                  if (dicteeMicro) arreterCapture()
                  tvResultat?.text = "🎤 Parle en français, je t'écoute..."
                  try {
                      val r = SpeechRecognizer.createSpeechRecognizer(this)
                      recoVoix = r
                      r.setRecognitionListener(object : RecognitionListener {
                          override fun onReadyForSpeech(params: Bundle?) {}
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(rmsdB: Float) {}
                          override fun onBufferReceived(buffer: ByteArray?) {}
                          override fun onEndOfSpeech() {}
                          override fun onEvent(eventType: Int, params: Bundle?) {}
                          override fun onPartialResults(partialResults: Bundle?) {
                              texte(partialResults)?.let { etMessage?.setText(it) }
                          }
                          override fun onResults(results: Bundle?) {
                              val t = texte(results)
                              finDictee()
                              if (t != null) {
                                  etMessage?.setText(t)
                                  etMessage?.setSelection(t.length)
                                  traduireMessage()
                              } else {
                                  tvResultat?.text = "Je n'ai pas entendu. Appuie sur 🎤 et réessaie."
                              }
                          }
                          override fun onError(error: Int) {
                              finDictee()
                              tvResultat?.text = "Je n'ai pas compris. Appuie sur 🎤 et réessaie."
                          }
                      })
                      r.startListening(intentBase("fr-FR", true))
                  } catch (e: Exception) {
                      finDictee()
                      tvResultat?.text = "Micro indisponible."
                  }
              }

              private fun finDictee() {
                  try { recoVoix?.destroy() } catch (_: Exception) {}
                  recoVoix = null
                  if (dicteeMicro) {
                      dicteeMicro = false
                      demarrerCapture(false)
                  }
                  if (dicteeReprendre && langue != null) {
                      dicteeReprendre = false
                      demarrerEcoute()
                  }
              }

              // ---------- la bulle prononce ma réponse dans l'autre langue ----------
              private fun ecouterResultat() {
                  val texte = tvResultat?.text?.toString() ?: return
                  if (texte.isBlank() || texte.startsWith("La traduction apparaîtra")) return
                  val l = cibleReponse ?: langue ?: return
                  val t = ttsRep
                  if (t == null) {
                      ttsRep = TextToSpeech(this) { st ->
                          if (st == TextToSpeech.SUCCESS) {
                              ttsRep?.setLanguage(Locale.forLanguageTag(l.parole))
                              ttsRep?.speak(texte, TextToSpeech.QUEUE_FLUSH, null, "rep")
                          }
                      }
                  } else {
                      t.setLanguage(Locale.forLanguageTag(l.parole))
                      t.speak(texte, TextToSpeech.QUEUE_FLUSH, null, "rep")
                  }
              }

