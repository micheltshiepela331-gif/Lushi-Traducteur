          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="72" android:viewportHeight="72">
              <path android:fillColor="#3C3489" android:pathData="M36,4a32,32 0,1 1,0 64a32,32 0,1 1,0 -64z"/>
              <path android:fillColor="#534AB7" android:pathData="M36,4a32,32 0,0 1,32 32h-64a32,32 0,0 1,32 -32z" android:fillAlpha="0.35"/>
